spring:
  datasource:
    url: jdbc:h2:mem:chatdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: true
logging:
  level:
    org.hibernate.SQL: debug
jwt:
  # 로컬 개발용 기본값. 운영에서는 환경변수로 주입한다.
  secret: ${JWT_SECRET:local-dev-secret-key-please-change-in-production-32bytes-min}
  expiration-seconds: 3600
